services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: transport-prediction-api:1.1.0

    container_name: transport-prediction-api

    ports:
      - "8000:8000"

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest

    container_name: transport-prediction-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro

    depends_on:
      - api

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest

    container_name: transport-prediction-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped


volumes:
  grafana_data: