services:

  # ==========================================================
  # API FASTAPI
  # ==========================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: transport-prediction-api:1.1.0

    container_name: transport-prediction-api

    ports:
      - "8000:8000"

    env_file:
      - ./application/config/.env

    environment:
      DB_HOST: host.docker.internal

    restart: unless-stopped

  # ==========================================================
  # PROMETHEUS
  # ==========================================================
  prometheus:
    image: prom/prometheus:latest

    container_name: transport-prediction-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro

    depends_on:
      - api

    restart: unless-stopped


  # ==========================================================
  # GRAFANA
  # ==========================================================
  grafana:
    image: grafana/grafana:latest

    container_name: transport-prediction-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped


# ============================================================
# VOLUMES
# ============================================================

volumes:
  grafana_data: