services:

  # ==========================================================
  # API FASTAPI
  # ==========================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: transport-prediction-api:1.1.0

    container_name: transport-prediction-api

    ports:
      - "8000:8000"

    env_file:
      - ./application/config/.env

    environment:
      DB_HOST: host.docker.internal
      MLFLOW_URL: http://mlflow:5000

    depends_on:
      - mlflow

    restart: unless-stopped


  # ==========================================================
  # STREAMLIT UI
  # ==========================================================
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui

    image: transport-prediction-ui:1.0.0

    container_name: transport-prediction-ui

    ports:
      - "8501:8501"

    env_file:
      - ./application/config/.env

    environment:
      API_URL: http://api:8000
      DB_HOST: host.docker.internal

      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000

      # Communication interne Docker
      MLFLOW_URL: http://mlflow:5000

    depends_on:
      - api
      - prometheus
      - grafana
      - mlflow

    restart: unless-stopped


  # ==========================================================
  # MLFLOW
  # ==========================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest

    container_name: transport-prediction-mlflow

    ports:
      - "5000:5000"

    volumes:

      # ------------------------------------------------------
      # Base SQLite MLflow existante
      # ------------------------------------------------------
      - ./mlflow.db:/mlflow/mlflow.db

      # ------------------------------------------------------
      # Artefacts MLflow existants
      # ------------------------------------------------------
      - ./mlruns:/mlruns

      # ------------------------------------------------------
      # Registry métier existant
      # ------------------------------------------------------
      - ./mlflow_registry:/mlflow_registry

      # ------------------------------------------------------
      # Modèles sources utilisés par register_models_mlflow.py
      # ------------------------------------------------------
      - ./application/models_a53:/models_a53

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlruns

    restart: unless-stopped


  # ==========================================================
  # PROMETHEUS
  # ==========================================================
  prometheus:
    image: prom/prometheus:latest

    container_name: transport-prediction-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro

    depends_on:
      - api

    restart: unless-stopped


  # ==========================================================
  # GRAFANA
  # ==========================================================
  grafana:
    image: grafana/grafana:latest

    container_name: transport-prediction-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped


# ==========================================================
# VOLUMES
# ==========================================================
volumes:

  grafana_data:
