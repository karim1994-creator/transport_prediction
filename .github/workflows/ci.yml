```yaml
# ============================================================
# CI/CD — TRANSPORT PREDICTION
#
# CI :
#   - installation
#   - vérification des artefacts
#   - tests pytest
#   - évaluation M1 / M2 / M3 / M4
#
# CD :
#   - construction de l'image Docker
#   - démarrage du conteneur
#   - test /health
#   - test /models
#
# IMPORTANT :
# Les tests CI ne dépendent pas d'une base PostgreSQL réelle.
# La persistance des prédictions est neutralisée pendant pytest.
#
# ============================================================

name: CI-CD Transport Prediction


# ============================================================
# DECLENCHEMENT
# ============================================================

on:

  push:

    branches:
      - main
      - master

  pull_request:

    branches:
      - main
      - master


# ============================================================
# JOB 1 — CI
# ============================================================

jobs:

  quality-check:

    name: CI - Tests et validation des modèles

    runs-on: ubuntu-latest


    # --------------------------------------------------------
    # VARIABLES DE TEST
    # --------------------------------------------------------
    #
    # Elles permettent à l'application de s'initialiser sans
    # utiliser les vraies informations PostgreSQL.
    #
    # --------------------------------------------------------

    env:

      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password


    steps:


      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout du dépôt

        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Installer Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ======================================================
      # 3. CACHE PIP
      # ======================================================

      - name: Configurer le cache pip

        uses: actions/cache@v4

        with:

          path: ~/.cache/pip

          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}

          restore-keys: |

            ${{ runner.os }}-pip-


      # ======================================================
      # 4. DEPENDANCES
      # ======================================================

      - name: Installer les dépendances

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements-ci.txt


      # ======================================================
      # 5. PYTHONPATH
      # ======================================================

      - name: Configurer PYTHONPATH

        run: |

          echo "PYTHONPATH=$GITHUB_WORKSPACE/application" >> $GITHUB_ENV


      # ======================================================
      # 6. VERIFICATION DES ARTEFACTS
      # ======================================================

      - name: Vérifier les modèles M1-M4

        shell: bash

        run: |

          echo "=============================================="

          echo "VERIFICATION DES ARTEFACTS"

          echo "=============================================="

          test -f models_a53/M1_hgb_historique_causal.joblib

          test -f models_a53/M2_hgb_historique_causal.joblib

          test -f models_a53/M3_baseline_historique.joblib

          test -f models_a53/M4_baseline_historique.joblib

          echo ""

          echo "M1 : OK"

          echo "M2 : OK"

          echo "M3 : OK"

          echo "M4 : OK"

          echo ""

          echo "Les 4 modèles sont présents."


      # ======================================================
      # 7. PREPARATION DES TESTS CI
      # ======================================================
      #
      # Les endpoints M3/M4 sauvegardent normalement les
      # prédictions dans PostgreSQL.
      #
      # Pour la CI, on teste la logique de prédiction sans
      # dépendre de la base métier réelle.
      #
      # Cette modification existe uniquement dans le runner
      # GitHub Actions et n'est jamais envoyée au dépôt.
      #
      # ======================================================

      - name: Préparer les tests CI

        shell: bash

        run: |

          cat > tests/conftest.py <<'PYTEST'

          import pytest


          @pytest.fixture(autouse=True)
          def disable_prediction_history(monkeypatch):

              from app.services.prediction_history import PredictionHistory


              def fake_save_profile_prediction(self, *args, **kwargs):

                  return None


              def fake_save_daily_prediction(self, *args, **kwargs):

                  return None


              monkeypatch.setattr(

                  PredictionHistory,

                  "save_profile_prediction",

                  fake_save_profile_prediction

              )


              monkeypatch.setattr(

                  PredictionHistory,

                  "save_daily_prediction",

                  fake_save_daily_prediction

              )

          PYTEST


          echo "Tests CI préparés."


      # ======================================================
      # 8. TESTS PYTEST
      # ======================================================

      - name: Exécuter les tests pytest

        run: |

          echo "=============================================="

          echo "EXECUTION DES TESTS PYTEST"

          echo "=============================================="

          pytest -v tests


      # ======================================================
      # 9. EVALUATION DES MODELES
      # ======================================================

      - name: Évaluer les modèles M1-M4

        run: |

          echo "=============================================="

          echo "EVALUATION DES MODELES"

          echo "=============================================="

          python evaluate_models_ci.py


      # ======================================================
      # 10. ARCHIVAGE DES RAPPORTS
      # ======================================================

      - name: Publier les rapports CI

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: model-evaluation-reports

          path: ci_reports/

          if-no-files-found: ignore


# ============================================================
# JOB 2 — CD / DOCKER
# ============================================================

  docker-validation:

    name: CD - Build et smoke tests Docker

    runs-on: ubuntu-latest

    needs:

      - quality-check


    steps:


      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout du dépôt

        uses: actions/checkout@v4


      # ======================================================
      # 2. VERIFICATION DOCKER
      # ======================================================

      - name: Vérifier Docker

        run: |

          docker --version


      # ======================================================
      # 3. CONSTRUCTION IMAGE
      # ======================================================

      - name: Construire l'image Docker

        run: |

          echo "=============================================="

          echo "CONSTRUCTION IMAGE DOCKER"

          echo "=============================================="

          docker build \
            -t transport-prediction-api:ci \
            .


      # ======================================================
      # 4. VERIFIER IMAGE
      # ======================================================

      - name: Vérifier l'image Docker

        run: |

          docker images

          docker image inspect \
            transport-prediction-api:ci


      # ======================================================
      # 5. DEMARRER LE CONTENEUR API
      # ======================================================

      - name: Démarrer le conteneur API

        run: |

          docker run \
            -d \
            --name transport-prediction-api \
            -p 8000:8000 \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=test_db \
            -e DB_USER=test_user \
            -e DB_PASSWORD=test_password \
            transport-prediction-api:ci


      # ======================================================
      # 6. ATTENDRE LE DEMARRAGE API
      # ======================================================

      - name: Attendre le démarrage de FastAPI

        shell: bash

        run: |

          echo "Attente du démarrage de l'API..."


          for i in {1..30}

          do

            if curl \
              --silent \
              --fail \
              http://127.0.0.1:8000/health

            then

              echo ""

              echo "API démarrée."

              exit 0

            fi


            echo "Tentative $i/30..."

            sleep 2

          done


          echo ""

          echo "ERREUR : l'API n'a pas démarré."

          echo ""

          docker logs transport-prediction-api

          exit 1


      # ======================================================
      # 7. TEST /health
      # ======================================================

      - name: Tester /health

        run: |

          echo "=============================================="

          echo "TEST /health"

          echo "=============================================="


          response=$(
            curl \
              --silent \
              --fail \
              http://127.0.0.1:8000/health
          )


          echo "$response"


          echo "$response" | grep '"status":"ok"'


          echo "$response" | grep '"models_loaded":4'


          echo ""

          echo "/health : OK"


      # ======================================================
      # 8. TEST /models
      # ======================================================

      - name: Tester /models

        run: |

          echo "=============================================="

          echo "TEST /models"

          echo "=============================================="


          response=$(
            curl \
              --silent \
              --fail \
              http://127.0.0.1:8000/models
          )


          echo "$response"


          echo "$response" | grep '"M1"'

          echo "$response" | grep '"M2"'

          echo "$response" | grep '"M3"'

          echo "$response" | grep '"M4"'

          echo "$response" | grep '"loaded":true"'


          echo ""

          echo "/models : OK"


      # ======================================================
      # 9. LOGS EN CAS D'ERREUR
      # ======================================================

      - name: Afficher les logs Docker

        if: failure()

        run: |

          echo "=============================================="

          echo "LOGS FASTAPI"

          echo "=============================================="


          docker logs transport-prediction-api || true


      # ======================================================
      # 10. ARRET CONTENEUR
      # ======================================================

      - name: Arrêter le conteneur

        if: always()

        run: |

          docker stop transport-prediction-api || true

          docker rm transport-prediction-api || true


      # ======================================================
      # 11. FIN CD
      # ======================================================

      - name: Validation Docker terminée

        if: success()

        run: |

          echo ""

          echo "=============================================="

          echo "       CD DOCKER VALIDEE"

          echo "=============================================="

          echo ""

          echo "Image construite : transport-prediction-api:ci"

          echo "FastAPI démarrée : OK"

          echo "M1 chargé : OK"

          echo "M2 chargé : OK"

          echo "M3 chargé : OK"

          echo "M4 chargé : OK"

          echo "/health : OK"

          echo "/models : OK"

          echo ""

          echo "=============================================="

          echo "       PIPELINE CI/CD : SUCCES"

          echo "=============================================="
```
