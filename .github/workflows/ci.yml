# ============================================================
# CI/CD — TRANSPORT PREDICTION
#
# CI :
#   - installation
#   - tests pytest
#   - vérification des artefacts
#   - évaluation M1 / M2 / M3 / M4
#
# CD :
#   - construction de l'image Docker
#   - démarrage du conteneur
#   - test /health
#   - test /models
#   - test /predict/m3
#   - test /predict/m4
#
# ============================================================

name: CI-CD Transport Prediction


# ============================================================
# DECLENCHEMENT
# ============================================================

on:

  push:

    branches:
      - main
      - master

  pull_request:

    branches:
      - main
      - master


# ============================================================
# JOB 1 — CI
# ============================================================

jobs:

  quality-check:

    name: CI - Tests et validation des modèles

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------

      - name: Checkout du dépôt
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. PYTHON
      # ------------------------------------------------------

      - name: Installer Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ------------------------------------------------------
      # 3. CACHE PIP
      # ------------------------------------------------------

      - name: Configurer le cache pip
        uses: actions/cache@v4

        with:

          path: ~/.cache/pip

          key:
            ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}

          restore-keys: |

            ${{ runner.os }}-pip-


      # ------------------------------------------------------
      # 4. DEPENDANCES
      # ------------------------------------------------------

      - name: Installer les dépendances
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements-ci.txt


      # ------------------------------------------------------
      # 5. PYTHONPATH
      # ------------------------------------------------------

      - name: Configurer PYTHONPATH
        run: |

          echo "PYTHONPATH=$GITHUB_WORKSPACE/application" >> $GITHUB_ENV


      # ------------------------------------------------------
      # 6. VERIFICATION DES ARTEFACTS
      # ------------------------------------------------------

      - name: Vérifier les modèles M1-M4
        shell: bash

        run: |

          echo "Vérification des artefacts..."

          test -f models_a53/M1_hgb_historique_causal.joblib

          test -f models_a53/M2_hgb_historique_causal.joblib

          test -f models_a53/M3_baseline_historique.joblib

          test -f models_a53/M4_baseline_historique.joblib

          echo ""
          echo "Les 4 modèles sont présents."


      # ------------------------------------------------------
      # 7. TESTS PYTEST
      # ------------------------------------------------------

      - name: Exécuter les tests pytest

        run: |

          pytest -v tests


      # ------------------------------------------------------
      # 8. EVALUATION MODELES
      # ------------------------------------------------------

      - name: Évaluer les modèles M1-M4

        run: |

          python evaluate_models_ci.py


      # ------------------------------------------------------
      # 9. ARCHIVAGE DES RAPPORTS
      # ------------------------------------------------------

      - name: Publier les rapports CI

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: model-evaluation-reports

          path: ci_reports/


# ============================================================
# JOB 2 — CD / DOCKER
# ============================================================

  docker-validation:

    name: CD - Build et smoke tests Docker

    runs-on: ubuntu-latest

    needs:

      - quality-check

    steps:


      # ------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------

      - name: Checkout du dépôt

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. VERIFICATION DOCKER
      # ------------------------------------------------------

      - name: Vérifier Docker

        run: |

          docker --version


      # ------------------------------------------------------
      # 3. CONSTRUCTION IMAGE
      # ------------------------------------------------------

      - name: Construire l'image Docker

        run: |

          docker build \
            -t transport-prediction-api:ci \
            .


      # ------------------------------------------------------
      # 4. VERIFIER IMAGE
      # ------------------------------------------------------

      - name: Vérifier l'image

        run: |

          docker images

          docker image inspect \
            transport-prediction-api:ci


      # ------------------------------------------------------
      # 5. DEMARRER LE CONTENEUR
      # ------------------------------------------------------

      - name: Démarrer le conteneur

        run: |

          docker run \
            -d \
            --name transport-prediction-api \
            -p 8000:8000 \
            transport-prediction-api:ci


      # ------------------------------------------------------
      # 6. ATTENDRE LE DEMARRAGE API
      # ------------------------------------------------------

      - name: Attendre le démarrage de FastAPI

        shell: bash

        run: |

          echo "Attente du démarrage de l'API..."

          for i in {1..30}
          do

            if curl \
              --silent \
              --fail \
              http://127.0.0.1:8000/health
            then

              echo ""
              echo "API démarrée."

              exit 0

            fi

            echo "Tentative $i/30..."

            sleep 2

          done

          echo "L'API n'a pas démarré."

          docker logs transport-prediction-api

          exit 1


      # ------------------------------------------------------
      # 7. TEST HEALTH
      # ------------------------------------------------------

      - name: Tester /health

        run: |

          response=$(
            curl \
              --silent \
              --fail \
              http://127.0.0.1:8000/health
          )

          echo "$response"

          echo "$response" | grep '"status":"ok"'

          echo "$response" | grep '"models_loaded":4'


      # ------------------------------------------------------
      # 8. TEST MODELS
      # ------------------------------------------------------

      - name: Tester /models

        run: |

          response=$(
            curl \
              --silent \
              --fail \
              http://127.0.0.1:8000/models
          )

          echo "$response"

          echo "$response" | grep '"M1"'

          echo "$response" | grep '"M2"'

          echo "$response" | grep '"M3"'

          echo "$response" | grep '"M4"'

          echo "$response" | grep '"loaded":true'


      # ------------------------------------------------------
      # 9. TEST PREDICTION M3
      # ------------------------------------------------------

      - name: Tester /predict/m3

        shell: bash

        run: |

          response=$(
            curl \
              --silent \
              --fail \
              -X POST \
              http://127.0.0.1:8000/predict/m3 \
              -H "Content-Type: application/json" \
              -d '{
                "profile": {
                  "code_arret": "810_801_594 ",
                  "id_zdc": "71590",
                  "cat_jour": "JOHV"
                }
              }'
          )

          echo "$response"

          echo "$response" | grep '"model":"M3"'

          echo "$response" | grep '"target":"pourc_validations"'

          echo "$response" | grep '"strategy":"baseline_historique"'

          echo "$response" | grep '"total_percent":'


      # ------------------------------------------------------
      # 10. TEST PREDICTION M4
      # ------------------------------------------------------

      - name: Tester /predict/m4

        shell: bash

        run: |

          response=$(
            curl \
              --silent \
              --fail \
              -X POST \
              http://127.0.0.1:8000/predict/m4 \
              -H "Content-Type: application/json" \
              -d '{
                "profile": {
                  "code_ligne": "534_534_524",
                  "id_groupofligne": "A00553",
                  "cat_jour": "JOHV"
                }
              }'
          )

          echo "$response"

          echo "$response" | grep '"model":"M4"'

          echo "$response" | grep '"target":"pourc_validations"'

          echo "$response" | grep '"strategy":"baseline_historique"'

          echo "$response" | grep '"total_percent":100'


      # ------------------------------------------------------
      # 11. LOGS EN CAS D'ERREUR
      # ------------------------------------------------------

      - name: Afficher les logs Docker

        if: failure()

        run: |

          docker logs transport-prediction-api


      # ------------------------------------------------------
      # 12. ARRET CONTENEUR
      # ------------------------------------------------------

      - name: Arrêter le conteneur

        if: always()

        run: |

          docker stop transport-prediction-api || true

          docker rm transport-prediction-api || true


      # ------------------------------------------------------
      # 13. FIN CD
      # ------------------------------------------------------

      - name: Validation Docker terminée

        if: success()

        run: |

          echo "=============================================="

          echo "CD DOCKER VALIDEE"

          echo "Image construite : transport-prediction-api:ci"

          echo "FastAPI démarrée"

          echo "M1-M4 chargés"

          echo "/health : OK"

          echo "/models : OK"

          echo "/predict/m3 : OK"

          echo "/predict/m4 : OK"

          echo "=============================================="